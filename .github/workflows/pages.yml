# Publica no GitHub Pages a cada envio para a main (grátis, sem chave nenhuma).
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Testes do diretor
        run: node tests/director.test.mjs && node tests/corpus.test.mjs
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
