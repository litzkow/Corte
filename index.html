<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corte">
<meta name="corte-build" content="2.3">
<title>Corte — editor de vídeo com IA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<input type="file" id="fileIn" accept="video/*,image/*,audio/*" multiple hidden>
<input type="file" id="musicIn" accept="audio/*,video/*" hidden>
<input type="file" id="refIn" accept="video/*" hidden>

<!-- ===================== INÍCIO ===================== -->
<section id="home" class="screen">
  <header class="home-top">
    <div class="brand">Corte<span>.</span></div>
    <button class="icon-btn" id="btnSettings" aria-label="Ajustes"></button>
  </header>
  <div class="home-body">
    <button class="new-card" id="btnNew">
      <span class="plus" aria-hidden="true"></span>
      <span class="nc-text"><b>Novo projeto</b><small>Vídeos, fotos ou narração. Tudo fica no seu aparelho.</small></span>
    </button>
    <div class="row-head"><h2>Estilos de IA</h2><span>Toque para começar com um</span></div>
    <div class="style-rail" id="styleRail"></div>
    <div class="row-head"><h2>Projetos</h2><span id="projCount"></span></div>
    <div class="proj-grid" id="projGrid"></div>
    <p class="app-version" id="appVersion"></p>
  </div>
</section>

<!-- ===================== EDITOR ===================== -->
<section id="editor" class="screen" hidden>
  <header class="ed-top">
    <button class="icon-btn" id="btnBack" aria-label="Voltar para o início"></button>
    <input class="proj-name" id="projName" aria-label="Nome do projeto">
    <button class="pill" id="btnFormat"><span id="fmtLabel">9:16 · Reels</span></button>
    <button class="btn-export" id="btnExport">Exportar</button>
  </header>

  <div class="stage" id="stage">
    <div class="player" id="player">
      <canvas id="preview"></canvas>
      <div class="safe" id="safeGuide" hidden></div>
      <div class="empty" id="emptyState">
        <p class="e-title">Pronto para editar</p>
        <p class="e-sub">Diga o que você quer na barra abaixo, ou escolha um estilo.</p>
        <div class="e-media" id="emptyMedia"></div>
      </div>
      <div class="busy" id="busy" hidden><div class="spinner"></div><ol id="stages"></ol></div>
    </div>
  </div>

  <div class="transport">
    <span class="tc" id="tc">00:00.0</span>
    <button class="icon-btn" id="btnUndo" aria-label="Desfazer"></button>
    <button class="play" id="btnPlay" aria-label="Tocar"></button>
    <button class="icon-btn" id="btnRedo" aria-label="Refazer"></button>
    <span class="tc dim" id="tcTotal">00:00.0</span>
  </div>

  <div class="timeline" id="timeline">
    <div class="playhead" aria-hidden="true"></div>
    <div class="tl-scroll" id="tlScroll"><div class="tl-inner" id="tlInner"></div></div>
    <div class="tl-zoom"><button id="zoomOut" aria-label="Diminuir linha do tempo">−</button><button id="zoomIn" aria-label="Aumentar linha do tempo">+</button></div>
  </div>

  <div class="ai-bar" id="aiBar">
    <button class="ai-mic" id="btnMic" aria-label="Falar o pedido"><span class="ring"></span></button>
    <input id="aiInput" placeholder="Peça para a IA editar…" autocomplete="off" enterkeyhint="send">
    <button class="ai-send" id="btnSend" aria-label="Enviar pedido"></button>
  </div>
  <div class="reply" id="reply" hidden></div>

  <nav class="toolbar" id="toolbar" aria-label="Ferramentas"></nav>
</section>

<!-- folhas -->
<div class="sheet" id="sheet" hidden><div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><button class="sheet-x" id="sheetX" aria-label="Fechar"></button><div id="sheetContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js?v=2.3"></script>
</body>
</html>
