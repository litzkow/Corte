<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<div id="out" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script type="module">
import { drawTextBlock, drawCaption, groupWords, markEmphasis, ensureFonts, FONTS, TEXT_STYLES, CAPTION_STYLES } from '../js/engine/captions.js';
await ensureFonts(Object.keys(FONTS));
const bg = new Image(); bg.src = 'bg.png'; await bg.decode();
const W = 360, H = 640, area = { x: W * 0.06, y: H * 0.12, w: W * 0.88, h: H * 0.7 };
const T = +(new URLSearchParams(location.search).get('t') || 2.2);
const words = 'Esse é o segredo que ninguém te conta sobre viajar barato'.split(' ').map((w, i) => ({ w, t0: i * 0.3, t1: i * 0.3 + 0.28 }));
const add = (label, fn) => { const d = document.createElement('div'); d.style.cssText = 'color:#fff;font:12px sans-serif;width:360px'; const c = document.createElement('canvas'); c.width = W; c.height = H; d.append(c, label); document.getElementById('out').append(d); const ctx = c.getContext('2d'); ctx.drawImage(bg, 0, 0, W, H); fn(ctx); };
const only = new URLSearchParams(location.search).get('k');
if (only !== 'cap') for (const [id, st] of Object.entries(TEXT_STYLES)) add('texto: ' + id, ctx => drawTextBlock(ctx, { text: st.sample, style: id, start: 0, dur: 8, beats: [0.3, 0.8, 1.3, 1.8, 2.3, 2.8, 3.3] }, T, W, H, area));
if (only !== 'txt') for (const id of ['dinamico', 'pilulas', 'duascores', 'calmo', 'serifa', 'contorno', 'papel']) add('legenda: ' + id, ctx => drawCaption(ctx, groupWords(markEmphasis(words), id, W), 1.0, id, area, H * 0.62, {}));
window.done = true;
</script>
