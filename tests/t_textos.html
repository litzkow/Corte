<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222">
<div id="out" style="display:flex;flex-wrap:wrap;gap:8px"></div>
<script type="module">
import { drawTextBlock, drawCaption, groupWords, markEmphasis, ensureFonts, FONTS, TEXT_STYLES } from '../js/engine/captions.js';
await ensureFonts(Object.keys(FONTS));
const bg = new Image(); bg.src = 'bg.png'; await bg.decode();
const W = 540, H = 960, area = { x: W * 0.06, y: H * 0.12, w: W * 0.88, h: H * 0.7 };
const items = [
  ['block', 'serifa', 'Dane-se o projeto verão. Agora a meta é ficar forte pra trocar soco com fascista'],
  ['block', 'contorno', 'Se me ver cruzando as pernas e fazendo coque no cabelo, me dá 10 minutos que eu resolvo'],
  ['block', 'papel', '27 horas de viagem'],
  ['cap', 'serifa'], ['cap', 'contorno'], ['cap', 'papel'],
];
const words = 'Esse é o segredo que ninguém te conta sobre viajar barato'.split(' ').map((w, i) => ({ w, t0: i * 0.3, t1: i * 0.3 + 0.28 }));
for (const [k, id, txt] of items) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; document.getElementById('out').append(c);
  const ctx = c.getContext('2d'); ctx.drawImage(bg, 0, 0, W, H);
  if (k === 'block') drawTextBlock(ctx, { text: txt, style: id, start: 0, dur: 99 }, 2, W, H, area);
  else drawCaption(ctx, groupWords(markEmphasis(words), id, W), 1.0, id, area, H * 0.62, {});
}
window.done = true;
</script>
